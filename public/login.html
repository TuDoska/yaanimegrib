<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід — YaAnimeGrib</title>
  <meta name="description" content="YaAnimeGrib — розклад серій аніме з таймерами, каталог, відгуки та спільний перегляд легальних відео з друзями.">
  <meta name="theme-color" content="#0f1512">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container page page--narrow">
    <div class="auth panel">
      <div class="segmented segmented--full">
        <button type="button" data-tab="login" data-i18n="auth.login"></button>
        <button type="button" data-tab="register" data-i18n="auth.register"></button>
      </div>
      <form id="auth-form" class="auth__form">
        <label class="label"><span data-i18n="auth.username"></span>
          <input class="field" name="username" autocomplete="username" required maxlength="20">
          <small class="muted hint" data-i18n="auth.username_hint"></small>
        </label>
        <label class="label"><span data-i18n="auth.password"></span>
          <input class="field" name="password" type="password" autocomplete="current-password" required maxlength="100">
          <small class="muted hint" data-i18n="auth.password_hint"></small>
        </label>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="btn btn--block"></button>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
