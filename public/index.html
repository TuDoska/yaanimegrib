<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YaAnimeGrib — розклад аніме, таймери серій і спільний перегляд</title>
  <meta name="description" content="YaAnimeGrib — розклад серій аніме з таймерами, каталог, відгуки та спільний перегляд легальних відео з друзями.">
  <meta name="theme-color" content="#0f1512">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="hero" id="hero">
      <div class="container hero__inner"><div class="skeleton skeleton--hero"></div></div>
    </section>

    <section class="container section">
      <div class="section__head">
        <h2 class="section__title" data-i18n="home.new_eps"></h2>
        <a class="section__more" href="schedule.html" data-i18n="common.see_all"></a>
      </div>
      <div class="grid" id="new-eps"></div>
    </section>

    <section class="container section">
      <div class="section__head">
        <h2 class="section__title">⏱ <span data-i18n="home.soon"></span></h2>
        <a class="section__more" href="schedule.html" data-i18n="common.see_all"></a>
      </div>
      <div class="grid" id="soon"></div>
    </section>

    <section class="container section">
      <div class="section__head">
        <h2 class="section__title">🍿 <span data-i18n="home.rooms"></span></h2>
        <a class="btn btn--small" href="rooms.html" data-i18n="home.rooms_cta"></a>
      </div>
      <div class="rooms-grid" id="rooms-list"></div>
    </section>

    <section class="container section section--last">
      <div class="section__head">
        <h2 class="section__title" data-i18n="home.season"></h2>
        <a class="section__more" href="catalog.html?status=RELEASING" data-i18n="common.see_all"></a>
      </div>
      <div class="grid" id="season"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/i18n.js"></script>
  <script src="js/anilist.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
